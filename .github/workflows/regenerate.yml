name: regenerate

# The scheduled pass that is the only writer of the four generated reports
# (port/reports/perf-backlog.md, divergences.md, order-containers.md and order-comparators.md).
# A port task's branch leaves all four alone; this is what keeps them current instead (task
# 23-perf-backlog, plan step 14 part 3). It is its own workflow file, not a job in
# .github/workflows/ci.yml, because that file is a conflict surface shared by many other tasks'
# branches and this one is not among them.
#
# Monday 04:17 UTC: often enough for a handover report, rare enough that it never races the
# fan-out this plan's other steps run.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# contents: write is what commits and pushes the regenerated reports to main.
# pull-requests: write is what the branch-protection fallback below needs to open a pull request
# when a direct push is refused; with contents: write alone that fallback fails with a 403, which
# is exactly the case it exists to cover.
permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v3

      # Shallow: the audits read the vendored tree at the pin, not its history.
      - name: Initialise the OrcaSlicer submodule (shallow)
        run: git submodule update --init --depth 1 vendor/OrcaSlicer

      - name: Regenerate every report
        run: just regenerate

      - name: Commit whatever moved
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add port/reports
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "regenerate: rewrite the generated reports"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push directly to main
        id: push
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:main
        continue-on-error: true

      # Branch protection refusing the direct push above (a 403) lands here, so the pass never
      # silently does nothing.
      - name: Open a pull request instead
        if: steps.commit.outputs.changed == 'true' && steps.push.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="regenerate/reports-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$branch"
          git push origin "$branch"
          gh pr create \
            --title "Regenerate the generated reports" \
            --base main \
            --head "$branch" \
            --body "Scheduled regeneration pass (.github/workflows/regenerate.yml): main's branch protection refused a direct push, so this opens a pull request instead. Review and merge to land the refreshed reports."

      - name: Check the order-dependence audits for drift
        run: just audit-check

      - name: Check the perf backlog for drift
        run: just perf-check
