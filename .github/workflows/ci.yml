name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Computes whether this push or pull request touches anything the macOS job's checks read,
  # so that job's `if` can skip it for a document-only change (R23) without a workflow-level
  # `on.pull_request.paths`, which would also skip this file's ubuntu job and the guard.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      oracle: ${{ steps.filter.outputs.oracle }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            oracle:
              - 'crates/**'
              - 'oracle/**'
              - 'port/**'
              - 'fixtures/**'
              - 'justfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-24.04
    steps:
      # Full history, because the guard compares the branch with main. The OrcaSlicer
      # submodule is checked out further down, shallowly, for the checks that read it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v3

      # `toolchain:` is a required input for this action (confirmed empirically: omitting it,
      # on the assumption the action would fall back to reading rust-toolchain.toml itself,
      # failed this job's first CI run with "'toolchain' is a required input"). So the version
      # is spelled out here, matching rust-toolchain.toml's channel; it is not derived from that
      # file, and the two must be kept in sync by hand.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Check out the OrcaSlicer submodule
        run: git submodule update --init --depth 1 vendor/OrcaSlicer

      - name: Checks
        run: just check

      - name: Port checks
        run: just port-check

      - name: Guard the branch
        if: github.event_name == 'pull_request'
        run: just guard "$GITHUB_HEAD_REF"

      # R28, task 36-pr-body-check: reads the pull request itself, so it cannot live in
      # .asdlc/checks, which a task also runs locally -- and needs no oracle binary or
      # libslic3r build, so it runs here rather than in the oracle-checks job below.
      - name: Check the pull request body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p oracle/.cache/tmp
          gh pr view "$PR" --json body --jq .body > oracle/.cache/tmp/pr-body.txt
          just pr-body-check oracle/.cache/tmp/pr-body.txt

  # Everything that needs the oracle binary, a local libslic3r build, or a comparison against
  # either (R23) — none of the document checks above wait on this job. Only `just oracle-fetch`
  # and `cargo test --workspace` are its lines today; every other line is added by the task that
  # makes it pass, named below so each adds its own line and no one writes this job twice:
  #
  #   - `just oracle-build`                                        -- task 13-build-libslic3r
  #   - `just oracle-parity`                                       -- task 28-oracle-parity
  #   - `just port-status` (without `--per-commit`)                -- plan step 23's last task
  #   - `just compare-stages`                                      -- task 40-compare-stages-ci
  #   - `just compare-benchy`                                      -- task 41-compare-benchy
  #   - `just compare-fixtures`                                    -- task 42-compare-fixtures
  #   - `just compare-configurations`                               -- task 43-compare-configurations
  #
  # `just pr-body-check` is the eighth later line and is NOT one of these: it reads the pull
  # request and needs no build, so plan step 21 (task 36-pr-body-check) adds it to the `check`
  # job above instead.
  #
  # The fallback this step's task.md records -- if the first cold build's wall-clock or disk
  # cost exceeds the runner's or the cache's limit, `just oracle-build` and `just oracle-parity`
  # move to `main` only, and this job keeps just the two lines below -- has been taken for the
  # build alone: task 13-build-libslic3r measured a cold build at 46m12s (stage one) + 35m08s
  # (stage two) on a hosted macos-15 runner (vendor/README.md), and moved `just oracle-build`
  # into its own `.github/workflows/oracle.yml`, which runs on `workflow_dispatch`, on push to
  # `main`, and on a pull request that touches `oracle/build-libslic3r`, that workflow or the
  # submodule pin -- paths far narrower than this job's own filter below, because almost no
  # change in this repository can affect that build. So `just oracle-build` is never a line in
  # *this* job; it stays where task 13 put it.
  #
  # `just oracle-parity` is not covered by that move. Task 13 touched only the build; plan step
  # 10 and task 28-oracle-parity's own text both still name this job -- the one below, in this
  # file -- as where `just oracle-parity` lands. That left one thing genuinely open, recorded
  # here rather than resolved by assertion: `just oracle-parity` needs a built libslic3r to
  # compare against the release binary, and this job built nothing, because the build now lives
  # in oracle.yml's own job. **Settled by task 30-ffi-bridge-libraries, the task that first made
  # it a hard requirement** rather than a nice-to-have: `crates/slic3r-ffi`'s libnest2d bridge
  # links step 7's built libslic3r (its `build.rs` panics by design if the archive is absent),
  # so `cargo test --workspace` below cannot run at all without that tree. This job takes the
  # second of the two options the open question named -- it reads oracle.yml's build tree,
  # through a restore-only cache step keyed verbatim from oracle.yml's own save (see that step's
  # comment). It still builds no libslic3r: oracle.yml remains the only producer, and `just
  # oracle-build` is still never a line here.
  oracle-checks:
    needs: changes
    # `!cancelled()` is load-bearing, not decorative: without it, GitHub skips this job whenever
    # `changes` fails or is cancelled, before this expression is even evaluated -- which is
    # exactly the trap this step's task.md names, because it would silently take the
    # unconditional push-to-main case away along with the filter. `!cancelled()` rather than
    # `always()`: it still runs on a failed or skipped filter job, but not on a cancelled
    # workflow run (e.g. superseded by a newer push), which `always()` would also start a macOS
    # runner for.
    if: "!cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.oracle == 'true'))"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check out the OrcaSlicer submodule
        run: git submodule update --init --depth 1 vendor/OrcaSlicer

      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v3

      # Same explicit toolchain as the ubuntu job's step, and the same reason (see its comment).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      # Reads the gitlink directly, matching .github/workflows/oracle.yml's own step, so the
      # cache key below is stable before the submodule checkout above and if that step is ever
      # reordered.
      - name: Resolve the submodule pin for the cache key
        id: submodule
        run: echo "sha=$(git rev-parse HEAD:vendor/OrcaSlicer)" >> "$GITHUB_OUTPUT"

      # The dependency superbuild's install prefix -- the only part oracle.yml's own workflow
      # keeps. Restore-only: nothing this job runs fills that tree, so there is nothing of this
      # job's own to save.
      #
      # task 29-ffi-bridge-core: widened to oracle.yml's own two-entry `path` list (and copied
      # its key/restore-keys verbatim), because actions/cache resolves an entry by key AND by a
      # version hash computed over the `path` list -- a narrower, single-path restore here used
      # to miss oracle.yml's save even on an identical key, because oracle.yml saves two paths
      # (`vendor/OrcaSlicer/deps/build/arm64` and `vendor/OrcaSlicer/deps/DL_CACHE`) where this
      # restored only the first path's child, `.../arm64/OrcaSlicer_dep`. Confirmed a matching
      # entry exists for this pin (`gh cache list`, key prefix
      # `oracle-deps-arm64-f92a7c065c5718b8ef1baac1cd704df2911238f4-`) before making this change:
      # this crate's build.rs now runs in this job's `cargo test --workspace` and needs the
      # superbuild prefix's `tbbmalloc` and TBB headers to not panic (build.rs:76), which is what
      # exposed the mismatch -- no earlier crate in the workspace required this job to actually
      # build anything.
      - name: Restore the dependency superbuild
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/OrcaSlicer/deps/build/arm64
            vendor/OrcaSlicer/deps/DL_CACHE
          key: oracle-deps-arm64-${{ steps.submodule.outputs.sha }}-${{ hashFiles('oracle/build-libslic3r') }}
          restore-keys: |
            oracle-deps-arm64-${{ steps.submodule.outputs.sha }}-
      # The main project's build tree -- the one oracle.yml's `just oracle-build` step produces
      # and saves (task 13-build-libslic3r), keyed there on the same pin and on that task's own
      # CMake flags. Nothing in *this* job builds it, so this is restore-only, with nothing of
      # this job's own to save.
      #
      # task 30-ffi-bridge-libraries: added here because this job stopped being able to run
      # without it. `crates/slic3r-ffi`'s build.rs panics by design when
      # `vendor/OrcaSlicer/build/arm64/src/libslic3r/Release/liblibslic3r.a` is absent -- the
      # libnest2d bridge links step 7's built libslic3r rather than rebuilding it -- so the
      # `cargo test --workspace` step below fails before compiling a single test. Measured, not
      # anticipated: the first oracle-checks run ever to get a macos-15 runner for that task's
      # branch died with exactly that panic (run 45645466718, `failed to run custom build
      # command for slic3r-ffi`), after three earlier runs were cancelled for want of a runner
      # and so never executed at all.
      #
      # `path` is oracle.yml's single-entry list, copied verbatim, *not* this job's two-path
      # dependency list above: actions/cache resolves an entry by key AND by a version hash
      # computed over the `path` list, so a differently-shaped list misses the save even on an
      # identical key -- the same trap the step above documents having fallen into. The key and
      # restore-keys are likewise verbatim from oracle.yml.
      - name: Restore the main project's build tree
        uses: actions/cache/restore@v4
        with:
          path: vendor/OrcaSlicer/build/arm64
          key: oracle-build-arm64-${{ steps.submodule.outputs.sha }}-${{ hashFiles('oracle/build-libslic3r') }}
          restore-keys: |
            oracle-build-arm64-${{ steps.submodule.outputs.sha }}-

      # GH_TOKEN authenticates oracle/fetch-release's `gh release download` call: the first CI
      # run of this step, unauthenticated, hit OrcaSlicer/OrcaSlicer's public rate limit (HTTP
      # 403, "API rate limit exceeded for <runner IP>") on its very first request, because a
      # hosted runner's IP is shared and anonymous GitHub API access is capped at 60/hour. An
      # authenticated request is a much higher limit regardless of which repo's public release
      # asset is being read.
      - name: Fetch the pinned oracle release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: just oracle-fetch

      - name: Run the workspace's tests
        run: cargo test --workspace

      # This job still builds no libslic3r (see the job-level comment above): `just oracle-parity`
      # needs vendor/OrcaSlicer/build/arm64's archives, which only oracle.yml's own job produces
      # and caches. When task 28-oracle-parity wrote this gate, no step here restored that tree,
      # so the gate's normal outcome was `built=false` and a skip with a note, deliberately,
      # rather than a permanently red check on every later task's pull request.
      #
      # task 30-ffi-bridge-libraries: the "Restore the main project's build tree" step above now
      # supplies that tree, so on a cache hit this gate reads `built=true` and `just
      # oracle-parity` actually runs -- which is what task 28 wanted and what the job-level
      # comment's open question asked a later task to arrange. The gate is kept exactly as it
      # was rather than hard-wired to true: a cache miss (an evicted entry, or a pin whose
      # oracle.yml run has not finished) must still skip with its note instead of failing the
      # job, and `cargo test --workspace` above will have already failed loudly in that case, so
      # nothing is being hidden by the skip.
      - name: Check whether the built libslic3r is available
        id: libslic3r-built
        run: |
          a=vendor/OrcaSlicer/build/arm64/src/libslic3r/Release/liblibslic3r.a
          b=vendor/OrcaSlicer/build/arm64/src/libslic3r/Release/liblibslic3r_cgal.a
          if [ -f "$a" ] && [ -f "$b" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping just oracle-parity: this job builds no libslic3r and $a is absent. See this job's own comment above (oracle.yml owns that build); a later task must either cache-restore it here or source it another way."
          fi

      - name: Report whether the two oracles agree
        if: steps.libslic3r-built.outputs.built == 'true'
        run: just oracle-parity
