name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Full history, because the guard compares the branch with main. The OrcaSlicer
      # submodule is not checked out: nothing here reads it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v3

      - name: Checks
        run: just check

      - name: Guard the branch
        if: github.event_name == 'pull_request'
        run: just guard "$GITHUB_HEAD_REF"

  # Created here holding only this task's step (`just oracle-build`) and its cache, per
  # task 13-build-libslic3r. No path filter, no `just oracle-fetch`, no
  # `cargo test --workspace`, and no cache of the dependency superbuild's install prefix
  # (`vendor/OrcaSlicer/deps/build/arm64/OrcaSlicer_dep`): those are task 24-port-check-ci's
  # half of this job, added when it lands. Until then this job runs on every pull request,
  # uncached for the dependency superbuild, and rebuilds that superbuild from scratch each
  # run.
  # macos-14 was dropped from GitHub's hosted-runner images (last image build
  # 2026-08-31, per actions/runner-images' releases, while macos-15 and
  # macos-26 keep shipping weekly) and requesting it here made every run of
  # this job cancel instantly with zero steps — confirmed via
  # `gh api .../actions/runs/<id>/jobs` showing `"status":"cancelled"`,
  # 0 billable ms, no steps at all, on two separate runs. macos-15 is arm64 by
  # default, same as macos-14 was, and is a currently served image.
  oracle-build:
    runs-on: macos-15
    # An uncached 21-dependency superbuild (24-port-check-ci adds that cache,
    # not this task) plus stage two's own configure/build could otherwise tie
    # up a runner for hours on a hang rather than a hard failure.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Shallow: only the pinned commit is needed, matching vendor/README.md's own
      # instructions for a fresh clone.
      - name: Check out the OrcaSlicer submodule
        run: git submodule update --init --depth 1 vendor/OrcaSlicer

      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v3

      # dep_MPFR (vendor/OrcaSlicer/deps/MPFR/MPFR.cmake, pulled in transitively by dep_OCCT)
      # runs `autoreconf -f -i` as its configure step, which regenerates its Makefile to
      # include doc targets that need `makeinfo` (texinfo); macos-15's hosted image carries
      # Homebrew itself but not these formulae (confirmed empirically, iteratively: the
      # first run of this job on this label failed stage one's configure with `autoreconf:
      # command not found` (exit 127); installing autoconf/automake/libtool got past that
      # and failed stage one's build instead with `missing: line 85: makeinfo: command not
      # found` (exit 2) — both missing on this runner despite a Homebrew-equipped dev
      # machine already having them). Nothing under vendor/OrcaSlicer/ changes; this only
      # makes the tools its own vendored configure/build steps call for available on the
      # runner.
      - name: Install autotools (dep_MPFR's configure/build steps need autoreconf, makeinfo)
        run: brew install autoconf automake libtool texinfo

      # Reads the gitlink entry directly, so it works before the submodule step above and
      # changes whenever vendor/README.md's "Changing the pin" procedure moves the pin.
      - name: Resolve the submodule pin for the cache key
        id: submodule
        run: echo "sha=$(git rev-parse HEAD:vendor/OrcaSlicer)" >> "$GITHUB_OUTPUT"

      # Keyed on the submodule pin and this script, which is where the stage-two CMake
      # flags (SLIC3R_GUI=OFF, SLIC3R_CAD=ON, -ffp-contract=off, ...) live, so either
      # changing invalidates the cache.
      - name: Cache the main project's build tree
        uses: actions/cache@v4
        with:
          path: vendor/OrcaSlicer/build/arm64
          # Hashing the script, not the flag values, is the key: the stage-two CMake
          # flags live only in oracle/build-libslic3r (see its CXX_FLAGS and
          # configure_cmd()), so a change there is exactly what should invalidate
          # this cache, and a comment-only edit invalidating it too is an accepted
          # over-approximation rather than a second place those flags have to be kept
          # in sync. restore-keys falls back to the newest cache for this pin when the
          # script changed, which still saves the (much slower) cold CMake+Ninja
          # reconfigure of this huge tree even on a flag change.
          key: oracle-build-arm64-${{ steps.submodule.outputs.sha }}-${{ hashFiles('oracle/build-libslic3r') }}
          restore-keys: |
            oracle-build-arm64-${{ steps.submodule.outputs.sha }}-

      # EXPECTED RED, as of task 13-build-libslic3r: stage one (the 21-dependency
      # superbuild) completes, and stage two then fails its first configure with
      # `Could NOT find LibLZMA (missing: LIBLZMA_INCLUDE_DIR)`. That is a real,
      # reported finding, not a regression in whatever change you are looking at:
      # vendor/README.md's "Building libslic3r locally (`just oracle-build`)" section
      # carries the error, the evidence for the mechanism and the untried next step,
      # and C7 in intent/libslic3r-rust-port/spec.md is the decision to report it
      # rather than work around it. No `continue-on-error` here on purpose: the step
      # should go green by fixing the build, and until then the red is the signal.
      # Because the step exits non-zero, the cache above restores but never saves
      # (actions/cache only saves in its post step on job success).
      - name: Build the vendored libslic3r (just oracle-build)
        run: just oracle-build
