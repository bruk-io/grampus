name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Full history, because the guard compares the branch with main. The OrcaSlicer
      # submodule is not checked out: nothing here reads it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v3

      - name: Checks
        run: just check

      - name: Guard the branch
        if: github.event_name == 'pull_request'
        run: just guard "$GITHUB_HEAD_REF"
